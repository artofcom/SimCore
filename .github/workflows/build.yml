name: SimCore CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  build:

    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build --config Release

    - name: Show build folder
      shell: cmd
      run: |
        dir build /s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimCore
        path: build/examples/console/console_demo.exe