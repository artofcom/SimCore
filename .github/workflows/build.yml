name: SimCore CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  build:

    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build --config Release